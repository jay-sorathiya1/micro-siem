# ============================================================
# Vector config: SOURCE -> TRANSFORM -> SINK
# This is the entire logic Vector follows, always these 3 steps
# ============================================================

# Where Vector remembers how far it has read each log file. Mounted as a
# Docker volume (vector-data), so a recreated container carries on where it
# stopped instead of skipping or re-reading lines.
data_dir = "/var/lib/vector"

# --- SOURCE 1: web login attempts (JSON lines written by FastAPI /login) ---
[sources.webapp_login]
type = "file"
include = ["/var/log/webapp/login.log"]
read_from = "end"          # only new lines from now on, not old history

# --- TRANSFORM 1: parse the JSON, already structured since we wrote it ourselves ---
# Each event already carries a "log_type" so FastAPI can filter by source later
[transforms.parse_webapp]
type = "remap"
inputs = ["webapp_login"]
source = '''
parsed, err = parse_json(.message)
if err == null {
    . = merge!(., parsed)
}
'''

# --- SOURCE 2: nginx access log (JSON format) ---
[sources.nginx_access]
type = "file"
include = ["/var/log/nginx/access_json.log"]
read_from = "end"

[transforms.parse_nginx]
type = "remap"
inputs = ["nginx_access"]
source = '''
parsed, err = parse_json(.message)
if err == null {
    . = merge!(., parsed)
}
'''

# --- SINK: where the data goes ---
[sinks.opensearch_logs]
type = "elasticsearch"
inputs = ["parse_webapp", "parse_nginx"]
endpoints = ["http://opensearch:9200"]
mode = "bulk"
api_version = "v8"

[sinks.opensearch_logs.bulk]
index = "logs-index"

# Console sink too, for debugging — lets you SEE events in `docker-compose logs vector`
[sinks.debug_console]
type = "console"
inputs = ["parse_webapp", "parse_nginx"]
encoding.codec = "json"
