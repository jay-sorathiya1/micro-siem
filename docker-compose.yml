services:

  # ---------------------------------------------------------
  # OpenSearch: stores and indexes logs + alerts
  # Ready-made official image, no Dockerfile needed
  # Versions are pinned (not :latest) so a surprise upgrade can't break the
  # demo - a version jump already broke Vector once (the _type bug).
  # ---------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true      # simplifies local dev; do NOT do this in production
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    # Bound to 127.0.0.1 only: the security plugin is off, so publishing
    # these on every interface would let anyone on the LAN read, delete or
    # forge logs and alerts. Vector reaches OpenSearch over the Docker
    # network and the API (host network) over localhost, so neither needs more.
    ports:
      - "127.0.0.1:9200:9200"   # REST API — this is what FastAPI/Vector talk to
      - "127.0.0.1:9600:9600"   # performance analyzer, not essential but harmless
    networks:
      - siem-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------
  # OpenSearch Dashboards: optional built-in UI for raw exploration
  # Handy for sanity-checking data before it hits the custom dashboards
  # ---------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"   # localhost only, same reason as OpenSearch
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - siem-net

  # ---------------------------------------------------------
  # Vector: reads the web login log and Nginx access log, pushes to OpenSearch
  # Ready-made official image, config is mounted in via volume
  # ---------------------------------------------------------
  vector:
    # vector-data keeps Vector's read checkpoints, so recreating the
    # container doesn't skip or re-read log lines.
    image: timberio/vector:0.59.0-alpine
    container_name: vector
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - webapp-logs:/var/log/webapp:ro
      - nginx-logs:/var/log/nginx:ro
      - vector-data:/var/lib/vector
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - siem-net
    command: ["--config", "/etc/vector/vector.toml"]

  # ---------------------------------------------------------
  # FastAPI: your detection engine + API layer
  # Custom Dockerfile — this is YOUR code
  #
  # NETWORK MODE: host, with NET_ADMIN capability.
  # IP-blocking (planned, currently disabled) runs `iptables` commands that
  # must affect the HOST's firewall, not just this container's, so this
  # container needs to share the host's network stack directly to
  # actually block traffic reaching it. Side effect: "ports" below is
  # ignored in host mode (the container just uses the host's network),
  # and it reaches OpenSearch via "localhost:9200" instead of the
  # Docker DNS name "opensearch:9200".
  # ---------------------------------------------------------
  api:
    build: ./src/api
    container_name: fastapi-app
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    # Dashboard passwords come from the git-ignored .env file (copy
    # .env.example to .env). Compose refuses to start if they're missing.
    environment:
      - OPENSEARCH_HOST=localhost
      - OPENSEARCH_PORT=9200
      - DASHBOARD_ADMIN_PASSWORD=${DASHBOARD_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      - DASHBOARD_VIEWER_PASSWORD=${DASHBOARD_VIEWER_PASSWORD:?set it in .env (see .env.example)}
    volumes:
      - webapp-logs:/var/log/webapp
    depends_on:
      opensearch:
        condition: service_healthy

  # ---------------------------------------------------------
  # Nginx: serves the crazy login page, proxies /api/ to FastAPI
  # Ready-made official image, config + page mounted via volume
  #
  # Since "api" now runs in network_mode: host (see above), it's no
  # longer reachable via the Docker DNS name "api" on the bridge
  # network. extra_hosts below maps host.docker.internal to the actual
  # host machine so this container can still reach FastAPI at
  # host.docker.internal:8000 (see nginx/default.conf).
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.30.6-alpine
    container_name: nginx-loginpage
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - siem-net

  # ---------------------------------------------------------
  # React Console: admin + viewer dashboards, terminal-style UI
  # Plain HTML + JS (Tailwind/Chart.js served locally from vendor/, so it
  # works without internet). Nginx serves the files and proxies /api/ to
  # FastAPI, so only port 8090 needs to be reachable.
  # ---------------------------------------------------------
  react-dashboard:
    image: nginx:1.30.6-alpine
    container_name: react-console
    ports:
      - "8090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./react-dashboard:/usr/share/nginx/html:ro
      - ./react-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - siem-net

networks:
  siem-net:
    driver: bridge

volumes:
  webapp-logs:
  nginx-logs:
  vector-data:
