log_format json_combined escape=json
  '{"timestamp":"$time_iso8601","source_ip":"$remote_addr",'
  '"method":"$request_method","path":"$request_uri",'
  '"status":$status,"log_type":"nginx_access"}';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access_json.log json_combined;

    # Real client IP: only believe X-Forwarded-For when the connection comes
    # from a trusted proxy on this machine (Docker bridge range = the host
    # itself, e.g. the ngrok agent; or loopback). A remote client connects
    # with its own IP, so its X-Forwarded-For header is ignored and it can't
    # spoof its address. $remote_addr below (and in the access log) is then
    # always a real IP address.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Serve the crazy login page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy login attempts through to FastAPI
    # api now runs in network_mode: host, so it's reached via the host
    # machine itself, not the Docker DNS name "api" anymore.
    # Both headers are REPLACED (not appended to) with the verified client
    # IP, so nothing the client sent gets passed on.
    location /api/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
