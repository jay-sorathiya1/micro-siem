log_format json_combined escape=json
  '{"timestamp":"$time_iso8601","source_ip":"$remote_addr",'
  '"method":"$request_method","path":"$request_uri",'
  '"status":$status,"log_type":"nginx_access"}';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access_json.log json_combined;

    # Serve the crazy login page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy login attempts through to FastAPI
    # api now runs in network_mode: host, so it's reached via the host
    # machine itself, not the Docker DNS name "api" anymore.
    location /api/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
