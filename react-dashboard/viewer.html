<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL-SIEM // Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --border: #1e293b;
            --accent: #38bdf8;
            --text-dim: #64748b;
        }
        body {
            background-color: var(--bg);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }
        .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .sidebar { background-color: #020617; border-right: 1px solid var(--border); width: 220px; }
        .nav-link { color: var(--text-dim); transition: all 0.15s; border-left: 2px solid transparent; }
        .nav-link.active { color: white; background: #1e293b; border-left: 2px solid var(--accent); }
        .panel { background: var(--surface); border: 1px solid var(--border); min-height: 0; }
        .chart-box { position: relative; flex-grow: 1; min-height: 0; }
        .chart-box canvas { position: absolute !important; top: 0; left: 0; width: 100% !important; height: 100% !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; }

        /* --- Mobile responsive --- */
        @media (max-width: 768px) {
            body { height: auto; min-height: 100vh; overflow-y: auto; font-size: 12px; }
            body.flex { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; padding: 8px 12px; }
            .sidebar > div:first-child { padding: 0; }
            .sidebar nav { display: none; }
            .sidebar > div:last-child { display: none; }
            main { height: auto; }
            header { padding: 8px 12px; height: auto; flex-wrap: wrap; gap: 6px; }
            .p-6 { padding: 12px !important; }
            .grid-cols-4 { grid-template-columns: repeat(2, 1fr) !important; }
            .grid-cols-3 { grid-template-columns: 1fr !important; height: auto !important; }
            .h-64 { height: 180px !important; }
            .panel canvas { max-height: 160px; }
        }
    </style>
</head>
<body class="flex">

    <!-- NAVIGATION SIDEBAR (Dashboard only for viewer role) -->
    <aside class="sidebar flex flex-col shrink-0">
        <div class="p-5 flex items-center gap-3">
            <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_8px_#10b981]"></div>
            <h1 class="font-bold tracking-tighter text-sm uppercase">Micro-SIEM <span class="font-light opacity-50">Viewer</span></h1>
        </div>

        <nav class="mt-4 flex-grow">
            <div class="nav-link active px-5 py-3 flex items-center gap-3">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"></path></svg> Dashboard
            </div>
        </nav>

        <div class="p-5 border-t border-slate-800 mono text-[9px] text-slate-500">
            ROLE: READ-ONLY VIEWER<br>
            No log/threat access<br>
            <button onclick="logout()" class="mt-2 text-rose-500 uppercase font-bold tracking-wide">Logout &rarr;</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-grow flex flex-col" style="min-height: 0;">

        <!-- HEADER -->
        <header class="h-14 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/20">
            <div class="flex items-center gap-2">
                <span class="text-[11px] uppercase tracking-widest text-slate-400 font-semibold">Dashboard</span>
                <span class="text-[9px] font-bold text-white bg-slate-700 px-2 py-0.5 rounded ml-2">VIEWER · READ-ONLY</span>
            </div>
            <div class="flex items-center gap-6">
                <div class="mono text-[10px] text-slate-500" id="live-clock"></div>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-[10px] uppercase font-bold text-slate-300">Viewer_Console</span>
                </div>
            </div>
        </header>

        <!-- DASHBOARD (only view - no logs/threats sections) -->
        <div class="p-6 overflow-hidden flex-grow flex flex-col" style="min-height: 0;">
            <div class="grid grid-cols-4 gap-4 mb-6">
                <div class="panel p-3 border-l-2 border-l-sky-500">
                    <div class="text-[10px] uppercase text-slate-500 font-bold mb-1">Total Logs</div>
                    <div class="text-xl font-medium tracking-tight" id="stat-logs">0</div>
                </div>
                <div class="panel p-3 border-l-2 border-l-rose-500">
                    <div class="text-[10px] uppercase text-slate-500 font-bold mb-1">Active Alerts</div>
                    <div class="text-xl font-medium tracking-tight text-rose-500" id="stat-alerts">0</div>
                </div>
                <div class="panel p-3 border-l-2 border-l-slate-700">
                    <div class="text-[10px] uppercase text-slate-500 font-bold mb-1">Suspicious IPs</div>
                    <div class="text-xl font-medium tracking-tight" id="stat-ips">0</div>
                </div>
                <div class="panel p-3 border-l-2 border-l-green-600">
                    <div class="text-[10px] uppercase text-slate-500 font-bold mb-1">Login Success Rate</div>
                    <div class="text-xl font-medium tracking-tight text-green-500" id="stat-success-rate">--%</div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 flex-grow" style="min-height: 0;">
                <div class="panel p-4 flex flex-col">
                    <span class="text-[10px] font-bold uppercase mb-4 text-slate-500 tracking-widest">Login Auth Status</span>
                    <div class="chart-box"><canvas id="loginChart"></canvas></div>
                </div>
                <div class="panel p-4 flex flex-col">
                    <span class="text-[10px] font-bold uppercase mb-4 text-slate-500 tracking-widest">Log Activity (Live)</span>
                    <div class="chart-box"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="panel p-4 flex flex-col">
                    <span class="text-[10px] font-bold uppercase mb-4 text-slate-500 tracking-widest">Attack Vectors Detected</span>
                    <div class="chart-box"><canvas id="barChart"></canvas></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = window.MICRO_SIEM_API_URL || `http://${window.location.hostname}:8000`;

        // --- Session guard: redirect to login if no valid token ---
        const SIEM_TOKEN = sessionStorage.getItem("siem_token");
        if (!SIEM_TOKEN) {
            window.location.href = "login.html";
        }
        function authFetch(url) {
            return fetch(url, { headers: { "Authorization": "Bearer " + SIEM_TOKEN } })
                .then(res => {
                    if (res.status === 401) {
                        sessionStorage.removeItem("siem_token");
                        sessionStorage.removeItem("siem_role");
                        window.location.href = "login.html";
                        throw new Error("Session expired");
                    }
                    return res.json();
                });
        }
        function logout() {
            fetch(`${API_URL}/auth/logout`, { method: "POST", headers: { "Authorization": "Bearer " + SIEM_TOKEN } })
                .finally(() => {
                    sessionStorage.clear();
                    window.location.href = "login.html";
                });
        }

        // --- CLOCK (Asia/Kolkata) ---
        setInterval(() => {
            const now = new Date();
            const istString = now.toLocaleString('en-GB', {
                timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
            }).replace(',', '');
            document.getElementById('live-clock').innerText = istString + " IST";
        }, 1000);

        function toIST(ts) {
            if (!ts) return '-';
            const d = new Date(ts.endsWith('Z') ? ts : ts + 'Z');
            return d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour12: false });
        }

        // --- CHART INSTANCES ---
        const themeColors = { blue: '#0ea5e9', slate: '#1e293b', rose: '#f43f5e', grid: '#1e293b66', text: '#64748b' };
        const noLegendConfig = { maintainAspectRatio: false, plugins: { legend: { display: false } } };
        const donutConfig = {
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 }, color: themeColors.text } } }
        };

        // Attack-vector bar colours: XSS + brute force = red, suspicious login = blue
        function alertColor(type) {
            if (type.includes('XSS') || type.includes('Brute Force')) return themeColors.rose;
            return themeColors.blue;
        }

        const loginChart = new Chart(document.getElementById('loginChart'), {
            type: 'doughnut',
            data: { labels: ['Success', 'Failed'], datasets: [{ data: [0, 0], backgroundColor: [themeColors.blue, themeColors.rose], borderWidth: 0 }] },
            options: { ...donutConfig, cutout: '85%' }
        });

        const lineChart = new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Logs', data: [], borderColor: themeColors.blue, backgroundColor: themeColors.blue + '22', fill: true, tension: 0.3, pointRadius: 2, pointBackgroundColor: themeColors.blue, borderWidth: 1.5 }] },
            options: { ...noLegendConfig, scales: { x: { display: false }, y: { grid: { color: themeColors.grid }, ticks: { color: themeColors.text, font: { size: 9 }, precision: 0 }, beginAtZero: true } } }
        });

        const barChart = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Count', data: [], backgroundColor: themeColors.blue, hoverBackgroundColor: '#38bdf8', borderRadius: 4 }] },
            options: { ...noLegendConfig, scales: { x: { ticks: { color: themeColors.text, font: { size: 9 } } }, y: { display: false, beginAtZero: true } } }
        });

        async function refresh() {
            let alerts = [], logs = [];
            try { alerts = (await authFetch(`${API_URL}/alerts`)).alerts || []; } catch (e) {}
            try { logs = (await authFetch(`${API_URL}/logs?limit=200`)).logs || []; } catch (e) {}

            document.getElementById('stat-logs').innerText = logs.length;
            document.getElementById('stat-alerts').innerText = alerts.length;
            document.getElementById('stat-ips').innerText = new Set(alerts.map(a => a.source_ip)).size;

            const webEvents = logs.filter(l => l.log_type === 'web_login');
            const successCount = webEvents.filter(l => l.event === 'login_success').length;
            const failCount = webEvents.filter(l => l.event === 'login_failed').length;
            const total = successCount + failCount;
            document.getElementById('stat-success-rate').innerText = total > 0 ? Math.round((successCount / total) * 100) + '%' : '--%';

            loginChart.data.datasets[0].data = [successCount, failCount];
            loginChart.update();

            const buckets = {};
            logs.forEach(l => {
                const t = l.timestamp ? toIST(l.timestamp).slice(0, 5) : '??:??';
                buckets[t] = (buckets[t] || 0) + 1;
            });
            const times = Object.keys(buckets).sort();
            lineChart.data.labels = times;
            lineChart.data.datasets[0].data = times.map(t => buckets[t]);
            lineChart.update();

            const typeCounts = {};
            alerts.forEach(a => { typeCounts[a.alert_type] = (typeCounts[a.alert_type] || 0) + 1; });
            barChart.data.labels = Object.keys(typeCounts);
            barChart.data.datasets[0].data = Object.values(typeCounts);
            barChart.data.datasets[0].backgroundColor = barChart.data.labels.map(alertColor);
            barChart.data.datasets[0].hoverBackgroundColor = barChart.data.labels.map(alertColor);
            barChart.update();
        }

        refresh();
        setInterval(refresh, 3000);
    </script>
</body>
</html>
