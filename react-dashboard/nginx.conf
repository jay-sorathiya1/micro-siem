server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP - same rule as the demo site's Nginx: X-Forwarded-For
    # is only believed from a trusted proxy on this machine (Docker bridge
    # range or loopback), never from a remote client.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Real auth happens in FastAPI (/auth/login + session tokens), not here.
    # Nginx serves static files. admin.html/viewer.html each redirect to
    # login.html client-side if no valid session token exists, and every
    # API call requires that token server-side too.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # The dashboards call the API through this same origin (/api/...), so
    # only port 8090 has to be reachable - from another PC, a phone or
    # through ngrok. api runs in network_mode: host, hence host.docker.internal.
    location /api/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }
}
