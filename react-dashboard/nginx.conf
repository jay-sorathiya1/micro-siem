server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Real auth now happens in FastAPI (/auth/login + session tokens),
    # not here. Nginx just serves static files. admin.html/viewer.html
    # each redirect to login.html client-side if no valid session token
    # exists, and every API call requires that token server-side too.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
